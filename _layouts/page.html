---
layout: default
---
<div class="container container--narrow page">
  <header class="page__head">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <article class="prose">
{{ content }}
  </article>
</div>
