# Builds the site, gates the template catalogue, signs templates.json and deploys both to Pages
# as ONE artifact (plan-s4-templates.md 4.2), so the body and its signature change together.
#
#   build   no secrets. Jekyll, the catalogue gates, the job summary the signer reads (risk
#           deltas, and a banner when the pipeline itself changed). Decides how the catalogue
#           is signed:
#             reuse      templates.json is byte-identical to the live one and the live
#                        signature verifies: copy it, no approval needed (docs-only pushes).
#             emergency  a committed templates.json.minisig, made offline with the emergency
#                        key (scripts/sign-emergency.sh), already verified by the gates.
#             sign       anything else: the sign job signs with the primary key.
#   sign    environment `catalog-signing` (main only; required reviewer). Runs no third-party
#           code and no repository script: check the environment still requires a reviewer,
#           download, compare, sign, verify, upload. Skipped in reuse mode.
#   verify  no secrets, no repository script: the Pages artifact about to be deployed (from
#           sign, or from build in reuse mode) must hold this commit's templates.json and a
#           signature that verifies against the pinned keys. The build job runs Jekyll and
#           repository scripts, so nothing it uploads is deployed unchecked.
#   deploy  actions/deploy-pages.
#   smoke   fetches the live pair with a cache-busting query and verifies it again.
#
# Pull requests run the build job only (gates and summary); nothing is signed or deployed and
# no secret is reachable (no pull_request_target, ever). Every action is pinned by commit SHA.
#
# Key rotation touches THREE places that must move together: keys/catalog-<role>.pub, the
# key id below, and the apps' pinned keys (meshTerm CatalogTrust). See plan 4.5 for the order.
name: Publish site and catalogue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Only main's runs share the Pages group (a pending run is replaced by a newer one in the same
# group, so a dispatch on another branch must not be able to cancel a pending main publish).
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'pages' || format('catalogue-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false

env:
  CATALOG_URL: https://meshdeck.ag-applications.com/templates.json
  PRIMARY_KEY_ID: 862A29760F5FC812
  EMERGENCY_KEY_ID: 61B6FABFCE0C67A9

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before any repository script runs, so an edited script cannot hide it.
      - name: Find the deployed commit, flag pipeline changes
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=50" --jq '.[].id'); do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success")] | length')
            if [ "$ok" != 0 ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)
              break
            fi
          done
          if [ -z "$sha" ]; then
            echo "::error::No successful github-pages deployment found, so there is no deployed version to compare with."
            exit 1
          fi
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only "$sha" HEAD -- .github scripts keys _config.yml)
          if [ -n "$changed" ]; then
            {
              echo '> [!WARNING]'
              echo "> **This push changes the publishing pipeline itself** since the deployed commit \`${sha:0:12}\`."
              echo '> The summary below is produced by that code, so it cannot vouch for itself. Before approving'
              echo '> the signing job, read the commit diff on github.com, not this page. Changed:'
              fixtures=0
              for path in $changed; do
                case "$path" in
                  scripts/fixtures/*.json) fixtures=$((fixtures + 1)) ;;
                  *) echo "> - \`$(printf '%s' "$path" | tr -c 'A-Za-z0-9._/@+=-' '?')\`" ;;
                esac
              done
              if [ "$fixtures" -gt 0 ]; then echo "> - $fixtures fixture file(s) under \`scripts/fixtures/\`"; fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::This push changes .github/, scripts/, keys/ or _config.yml; read the diff before approving the signature."
          fi

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Self-test the gates
        run: python3 scripts/check-catalog.py --self-test

      - name: Catalogue gates
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          python3 scripts/check-catalog.py --deployed-ref "$DEPLOYED_SHA" \
            --live --live-url "$CATALOG_URL" --risk --no-banner --summary "$GITHUB_STEP_SUMMARY"

      - name: Build the site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Check the built site
        run: python3 scripts/check-catalog.py --site _site

      # The reuse check below verifies the live signature against keys/, so keys/ must hold the
      # pinned keys (the sign job checks the same before it signs).
      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/catalog-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/catalog-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: Choose how the catalogue is signed
        id: mode
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("templates.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          cp -R _site/. "$RUNNER_TEMP/site/"
          if python3 scripts/catalog_signature.py reuse --url "$CATALOG_URL" --body templates.json \
               --out "$RUNNER_TEMP/site/templates.json.minisig"; then
            mode=reuse
            line="**Signature:** the live signature of version $version is reused (the catalogue did not change). No approval is needed."
          elif [ -f templates.json.minisig ]; then
            mode=emergency
            line="**Signature:** the committed EMERGENCY signature of version $version is used (verified by the gates). Approve the \`catalog-signing\` job to publish it."
          else
            mode=sign
            line="**Signature:** version $version needs a new signature. Approve the \`catalog-signing\` job only after reading this summary and the diff."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          { echo; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the site for signing
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode != 'reuse'
        run: tar -C "$RUNNER_TEMP/site" -cf "$RUNNER_TEMP/site.tar" .

      - name: Upload the site for signing
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode != 'reuse'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-unsigned
          path: ${{ runner.temp }}/site.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload the Pages artifact (live signature reused)
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'reuse'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  sign:
    name: Sign the catalogue
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: catalog-signing
    permissions:
      contents: read
      actions: read
    env:
      MODE: ${{ needs.build.outputs.mode }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Fails closed when the environment no longer gates this job: with no required reviewer it
      # runs unattended and would sign whatever reached main. A guard against a settings mistake
      # (removing a reviewer, admin bypass, a wider branch policy). A push that edits this file can
      # remove the guard too, which is why the reviewer reads the diff of any pipeline change.
      - name: Check the environment still requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            gh api "$1" 2>/dev/null \
              || curl -fsS --max-time 20 -H 'Accept: application/vnd.github+json' "https://api.github.com/$1"
          }
          ENV_JSON=$(api "repos/$GITHUB_REPOSITORY/environments/catalog-signing")
          POLICIES_JSON=$(api "repos/$GITHUB_REPOSITORY/environments/catalog-signing/deployment-branch-policies")
          export ENV_JSON POLICIES_JSON
          python3 - <<'PY'
          import json, os, sys
          env = json.loads(os.environ["ENV_JSON"])
          policies = json.loads(os.environ["POLICIES_JSON"])
          rules = [r for r in env.get("protection_rules") or [] if r.get("type") == "required_reviewers"]
          reviewers = [who for rule in rules for who in rule.get("reviewers") or []]
          problems = []
          if not reviewers:
              problems.append("has no required reviewer")
          if env.get("can_admins_bypass") is not False:
              problems.append("lets administrators bypass its protection rules")
          names = sorted(f"{p.get('type')}:{p.get('name')}" for p in policies.get("branch_policies") or [])
          if not (env.get("deployment_branch_policy") or {}).get("custom_branch_policies") or names != ["branch:main"]:
              problems.append(f"does not limit deployments to main alone ({', '.join(names) or 'no branch policy'})")
          for problem in problems:
              print(f"::error::Refusing to sign: the catalog-signing environment {problem}. Fix it in Settings > Environments, then re-run.")
          if problems:
              sys.exit(1)
          if not any(rule.get("prevent_self_review") for rule in rules):
              print("::warning::catalog-signing does not prevent self-review (plan 4.2: a dedicated signer account, self-review prevented).")
          print(f"catalog-signing: {len(reviewers)} required reviewer(s), administrators cannot bypass, main only.")
          PY

      # Only the catalogue, a committed emergency signature and the public keys: no scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /templates.json
            /templates.json.minisig
            /keys/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-unsigned
          path: ${{ runner.temp }}/in

      # The build job ran Jekyll and repository scripts, so its tarball is untrusted input here:
      # regular files and directories only (upload-pages-artifact packs with tar --dereference,
      # so a symlink would publish whatever it points at), unpacked outside the checkout.
      - name: Unpack and compare with the commit
        run: |
          set -euo pipefail
          bad=$(tar -tvf "$RUNNER_TEMP/in/site.tar" | grep -v '^[-d]' || true)
          if [ -n "$bad" ]; then
            echo "::error::the build artifact holds entries that are not regular files or directories"
            printf '%s\n' "$bad" | head -20
            exit 1
          fi
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          mkdir "$site"
          tar -C "$site" --no-same-owner --no-same-permissions -xf "$RUNNER_TEMP/in/site.tar"
          left=$(find "$site" ! -type f ! -type d | head -5)
          [ -z "$left" ] || { echo "::error::unexpected entries after unpacking: $left"; exit 1; }
          cmp "$site/templates.json" templates.json
          body=$(python3 - <<'PY'
          import json
          def pairs(items):
              keys = [key for key, _ in items]
              if len(set(keys)) != len(keys):
                  raise SystemExit("templates.json has a duplicate key")
              return dict(items)
          version = json.load(open("templates.json", encoding="utf-8"), object_pairs_hook=pairs)["version"]
          assert type(version) is int and version > 0
          print(version)
          PY
          )
          [ "$body" = "$VERSION" ] || { echo "::error::templates.json is version $body, the build said $VERSION"; exit 1; }
          case "$MODE" in sign|emergency) ;; *) echo "::error::unknown mode $MODE"; exit 1 ;; esac

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/catalog-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/catalog-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: Use the committed emergency signature
        if: env.MODE == 'emergency'
        run: |
          set -euo pipefail
          test -f templates.json.minisig
          cp templates.json.minisig "$RUNNER_TEMP/site/templates.json.minisig"

      - name: Sign with the primary key
        if: env.MODE == 'sign'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${MINISIGN_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::MINISIGN_KEY / MINISIGN_PASSWORD are not set in the catalog-signing environment."
            exit 1
          fi
          key="$RUNNER_TEMP/catalog-primary.key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          site="$RUNNER_TEMP/site"
          rm -f "$site/templates.json.minisig"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$site/templates.json" \
            -x "$site/templates.json.minisig" -t "catalog=templates version=$VERSION commit=$GITHUB_SHA" >/dev/null

      - name: Verify before publishing
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          if [ "$MODE" = emergency ]; then
            pub=keys/catalog-emergency.pub
            want="trusted comment: catalog=templates version=$VERSION"
          else
            pub=keys/catalog-primary.pub
            want="trusted comment: catalog=templates version=$VERSION commit=$GITHUB_SHA"
          fi
          minisign -V -q -p "$pub" -m "$site/templates.json" -x "$site/templates.json.minisig"
          got=$(sed -n 3p "$site/templates.json.minisig")
          [ "$got" = "$want" ] || { echo "::error::trusted comment is '$got', expected '$want'"; exit 1; }
          echo "Verified against $pub: ${got#trusted comment: }" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # The last gate before Pages, for every mode: in reuse mode the build job (which runs Jekyll and
  # repository scripts) uploaded the Pages artifact itself, so this job, which runs neither, checks
  # what is about to be deployed: this commit's templates.json, byte for byte, and a signature
  # that verifies against the pinned keys with the trusted comment the mode calls for.
  verify:
    name: Check the Pages artifact
    needs: [build, sign]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.build.result == 'success'
      && (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && needs.build.outputs.mode == 'reuse'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MODE: ${{ needs.build.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /templates.json
            /keys/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/catalog-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/catalog-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: The artifact holds this commit's catalogue and a valid signature
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/pages/artifact.tar"
          bad=$(tar -tvf "$tarball" | grep -v '^[-d]' || true)
          [ -z "$bad" ] || { echo "::error::the Pages artifact holds entries that are not regular files or directories"; exit 1; }
          site="$RUNNER_TEMP/check"
          rm -rf "$site"
          mkdir "$site"
          tar -C "$site" --no-same-owner --no-same-permissions -xf "$tarball"
          cmp "$site/templates.json" templates.json
          test -f "$site/templates.json.minisig" || { echo "::error::the Pages artifact has no templates.json.minisig"; exit 1; }
          version=$(python3 - <<'PY'
          import json
          def pairs(items):
              keys = [key for key, _ in items]
              if len(set(keys)) != len(keys):
                  raise SystemExit("templates.json has a duplicate key")
              return dict(items)
          version = json.load(open("templates.json", encoding="utf-8"), object_pairs_hook=pairs)["version"]
          assert type(version) is int and version > 0
          print(version)
          PY
          )
          case "$MODE" in
            sign)      roles="primary";           pattern="^catalog=templates version=$version commit=$GITHUB_SHA\$" ;;
            emergency) roles="emergency";         pattern="^catalog=templates version=$version\$" ;;
            reuse)     roles="primary emergency"; pattern="^catalog=templates version=$version( commit=[0-9a-f]{40})?\$" ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          line=$(sed -n 3p "$site/templates.json.minisig")
          comment=${line#trusted comment: }
          if [ "$line" = "$comment" ] || ! printf '%s\n' "$comment" | grep -Eq "$pattern"; then
            echo "::error::trusted comment '$line' is not what $MODE mode publishes for version $version"
            exit 1
          fi
          signer=""
          for role in $roles; do
            if minisign -V -q -p "keys/catalog-$role.pub" -m "$site/templates.json" -x "$site/templates.json.minisig" 2>/dev/null; then
              signer=$role
              break
            fi
          done
          [ -n "$signer" ] || { echo "::error::templates.json.minisig does not verify against keys/catalog-{${roles// /,}}.pub"; exit 1; }
          echo "Pages artifact checked: templates.json v$version ($MODE mode), signed by the $signer key: $comment" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Pages
    needs: verify
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Verify the live pair
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /templates.json
            /keys/
            /scripts/catalog_signature.py

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      # The CDN caches each file for up to 600 s; a lagging version after ~10 minutes is a warning,
      # a signature that does not verify (or a live version above this one) fails the job.
      - name: Fetch and verify the live templates.json and its signature
        run: python3 scripts/catalog_signature.py smoke --url "$CATALOG_URL" --expect-body templates.json --tries 4 --interval 200
