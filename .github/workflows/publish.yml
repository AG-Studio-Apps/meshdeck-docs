# Builds the site, gates the template catalogue, signs templates.json and deploys both to Pages
# as ONE artifact (plan-s4-templates.md 4.2), so the body and its signature change together.
#
#   build   no secrets. Jekyll, the catalogue gates, the job summary the signer reads (risk
#           deltas, and a banner when the pipeline itself changed). Decides how the catalogue
#           is signed:
#             reuse      templates.json is byte-identical to the live one and the live
#                        signature verifies: copy it, no approval needed (docs-only pushes).
#             emergency  a committed templates.json.minisig, made offline with the emergency
#                        key (scripts/sign-emergency.sh), already verified by the gates.
#             sign       anything else: the sign job signs with the primary key.
#   sign    environment `catalog-signing` (main only; required reviewer). Runs no third-party
#           code and no repository script: download, compare, sign, verify, upload. Skipped
#           in reuse mode.
#   deploy  actions/deploy-pages.
#   smoke   fetches the live pair with a cache-busting query and verifies it again.
#
# Pull requests run the build job only (gates and summary); nothing is signed or deployed and
# no secret is reachable (no pull_request_target, ever). Every action is pinned by commit SHA.
#
# Key rotation touches THREE places that must move together: keys/catalog-<role>.pub, the
# key id below, and the apps' pinned keys (meshTerm CatalogTrust). See plan 4.5 for the order.
name: Publish site and catalogue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('catalogue-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

env:
  CATALOG_URL: https://meshdeck.ag-applications.com/templates.json
  PRIMARY_KEY_ID: 862A29760F5FC812
  EMERGENCY_KEY_ID: 61B6FABFCE0C67A9

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before any repository script runs, so an edited script cannot hide it.
      - name: Find the deployed commit, flag pipeline changes
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=50" --jq '.[].id'); do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success")] | length')
            if [ "$ok" != 0 ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)
              break
            fi
          done
          if [ -z "$sha" ]; then
            echo "::error::No successful github-pages deployment found, so there is no deployed version to compare with."
            exit 1
          fi
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only "$sha" HEAD -- .github scripts keys _config.yml)
          if [ -n "$changed" ]; then
            {
              echo '> [!WARNING]'
              echo "> **This push changes the publishing pipeline itself** since the deployed commit \`${sha:0:12}\`."
              echo '> The summary below is produced by that code, so it cannot vouch for itself. Before approving'
              echo '> the signing job, read the commit diff on github.com, not this page. Changed:'
              fixtures=0
              for path in $changed; do
                case "$path" in
                  scripts/fixtures/*.json) fixtures=$((fixtures + 1)) ;;
                  *) echo "> - \`$path\`" ;;
                esac
              done
              if [ "$fixtures" -gt 0 ]; then echo "> - $fixtures fixture file(s) under \`scripts/fixtures/\`"; fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::This push changes .github/, scripts/, keys/ or _config.yml; read the diff before approving the signature."
          fi

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Self-test the gates
        run: python3 scripts/check-catalog.py --self-test

      - name: Catalogue gates
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          python3 scripts/check-catalog.py --deployed-ref "$DEPLOYED_SHA" \
            --live --live-url "$CATALOG_URL" --risk --no-banner --summary "$GITHUB_STEP_SUMMARY"

      - name: Build the site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Check the built site
        run: python3 scripts/check-catalog.py --site _site

      # The reuse check below verifies the live signature against keys/, so keys/ must hold the
      # pinned keys (the sign job checks the same before it signs).
      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/catalog-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/catalog-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: Choose how the catalogue is signed
        id: mode
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("templates.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          cp -R _site/. "$RUNNER_TEMP/site/"
          if python3 scripts/catalog_signature.py reuse --url "$CATALOG_URL" --body templates.json \
               --out "$RUNNER_TEMP/site/templates.json.minisig"; then
            mode=reuse
            line="**Signature:** the live signature of version $version is reused (the catalogue did not change). No approval is needed."
          elif [ -f templates.json.minisig ]; then
            mode=emergency
            line="**Signature:** the committed EMERGENCY signature of version $version is used (verified by the gates). Approve the \`catalog-signing\` job to publish it."
          else
            mode=sign
            line="**Signature:** version $version needs a new signature. Approve the \`catalog-signing\` job only after reading this summary and the diff."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          { echo; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the site for signing
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode != 'reuse'
        run: tar -C "$RUNNER_TEMP/site" -cf "$RUNNER_TEMP/site.tar" .

      - name: Upload the site for signing
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode != 'reuse'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-unsigned
          path: ${{ runner.temp }}/site.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload the Pages artifact (live signature reused)
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'reuse'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  sign:
    name: Sign the catalogue
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: catalog-signing
    permissions:
      contents: read
    env:
      MODE: ${{ needs.build.outputs.mode }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Only the catalogue, a committed emergency signature and the public keys: no scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /templates.json
            /templates.json.minisig
            /keys/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-unsigned
          path: ${{ runner.temp }}/in

      - name: Unpack and compare with the commit
        run: |
          set -euo pipefail
          mkdir site
          tar -C site -xf "$RUNNER_TEMP/in/site.tar"
          cmp site/templates.json templates.json
          body=$(python3 -c 'import json; v = json.load(open("templates.json"))["version"]; assert type(v) is int and v > 0; print(v)')
          [ "$body" = "$VERSION" ] || { echo "::error::templates.json is version $body, the build said $VERSION"; exit 1; }
          case "$MODE" in sign|emergency) ;; *) echo "::error::unknown mode $MODE"; exit 1 ;; esac

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/catalog-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/catalog-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: Use the committed emergency signature
        if: env.MODE == 'emergency'
        run: |
          set -euo pipefail
          test -f templates.json.minisig
          cp templates.json.minisig site/templates.json.minisig

      - name: Sign with the primary key
        if: env.MODE == 'sign'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${MINISIGN_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::MINISIGN_KEY / MINISIGN_PASSWORD are not set in the catalog-signing environment."
            exit 1
          fi
          key="$RUNNER_TEMP/catalog-primary.key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          rm -f site/templates.json.minisig
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m site/templates.json \
            -x site/templates.json.minisig -t "catalog=templates version=$VERSION commit=$GITHUB_SHA" >/dev/null

      - name: Verify before publishing
        run: |
          set -euo pipefail
          if [ "$MODE" = emergency ]; then
            pub=keys/catalog-emergency.pub
            want="trusted comment: catalog=templates version=$VERSION"
          else
            pub=keys/catalog-primary.pub
            want="trusted comment: catalog=templates version=$VERSION commit=$GITHUB_SHA"
          fi
          minisign -V -q -p "$pub" -m site/templates.json -x site/templates.json.minisig
          got=$(sed -n 3p site/templates.json.minisig)
          [ "$got" = "$want" ] || { echo "::error::trusted comment is '$got', expected '$want'"; exit 1; }
          echo "Verified against $pub: ${got#trusted comment: }" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: [build, sign]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.build.result == 'success'
      && (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && needs.build.outputs.mode == 'reuse'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Verify the live pair
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /templates.json
            /keys/
            /scripts/catalog_signature.py

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      # The CDN caches each file for up to 600 s; a lagging version after ~10 minutes is a warning,
      # a signature that does not verify (or a live version above this one) fails the job.
      - name: Fetch and verify the live templates.json and its signature
        run: python3 scripts/catalog_signature.py smoke --url "$CATALOG_URL" --expect-body templates.json --tries 4 --interval 200
