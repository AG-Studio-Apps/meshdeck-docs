# Deploy the stack templates in templates.json on the runner's Docker daemon and
# confirm they come up — so a template with a dead image or broken compose fails
# here, not on someone's host. A push tests only the templates it changed (the
# catalog is large; pulling every image each push trips registry rate limits and
# flakes). A manual run or the weekly schedule tests everything (catches upstream
# image rot). A second pass pins the OLDEST Compose meshDeck supports (Debian 13 stable's
# 2.26.1) and deploys the templates that use `configs.content` for real, reading the mounted
# file back — the only check that proves the floor, since `config -q` passes on versions
# that fail and `up --dry-run` mounts nothing. A third pass runs the same check on the NEWEST
# Compose release, so a new release that breaks a template is caught here (the weekly sweep
# picks up each release within a week), not on a rolling-release host.
name: Test stack templates
on:
  push:
    paths: ["templates.json", "scripts/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — full sweep for image rot
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # so a push can diff the catalog against the previous commit
          persist-credentials: false  # the steps below run third-party images
      # The catalogue gates (scripts/check-catalog.py), so a templates.json change without a version
      # bump, or one the apps would refuse, goes red on any branch. The publish workflow runs the same
      # gates against the DEPLOYED commit before it signs; this one compares with the previous commit.
      - name: Catalogue gates
        run: python3 scripts/check-catalog.py --deployed-ref HEAD~1

      - name: Deploy and check templates
        if: always()
        run: python3 scripts/test-templates.py
        env:
          # push → only changed templates; manual/scheduled → everything
          TEST_ALL: ${{ github.event_name != 'push' && '1' || '' }}

      # The runner's ambient Compose is far newer than the oldest one meshDeck promises to
      # support, so the step above cannot catch a template that quietly raises the minimum.
      # This one pins Debian 13 stable's version and proves the catalog still runs on it.
      - name: Pin the Compose floor
        # Independent of the deploy sweep above: that step pulls ~60 images and can fail on
        # a transient registry rate limit, which must not stop the floor from being checked.
        if: always()
        run: |
          curl -fsSL -o /usr/local/bin/docker-compose-floor \
            "https://github.com/docker/compose/releases/download/v${FLOOR}/docker-compose-linux-x86_64"
          chmod +x /usr/local/bin/docker-compose-floor
          test "$(docker-compose-floor version --short)" = "$FLOOR"
        env:
          FLOOR: "2.26.1"

      - name: Check the templates against the floor
        if: always()
        run: python3 scripts/check-compose-floor.py
        env:
          COMPOSE_BIN: docker-compose-floor

      # The newest Compose release, whatever it is today (resolved at run time, so the weekly
      # sweep follows new releases with no edit here). Checked against the release's own
      # published checksum before it runs.
      - name: Fetch the newest Compose
        if: always()
        run: |
          tag="$(gh api repos/docker/compose/releases/latest --jq .tag_name)"
          base="https://github.com/docker/compose/releases/download/${tag}"
          curl -fsSL -o /tmp/docker-compose-linux-x86_64 "${base}/docker-compose-linux-x86_64"
          curl -fsSL -o /tmp/docker-compose-linux-x86_64.sha256 "${base}/docker-compose-linux-x86_64.sha256"
          (cd /tmp && sha256sum -c docker-compose-linux-x86_64.sha256)
          install -m 0755 /tmp/docker-compose-linux-x86_64 /usr/local/bin/docker-compose-newest
          test "v$(docker-compose-newest version --short)" = "$tag"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check the templates against the newest Compose
        if: always()
        run: python3 scripts/check-compose-floor.py
        env:
          COMPOSE_BIN: docker-compose-newest
          COMPOSE_LABEL: newest
